name: Release binaries

# Trigger: any tag of the form v1.2.3 (SemVer with leading v).
# To release: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*"

# Minimal token scope, widened only for the upload step below.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun cross-compiles standalone executables for every target from a
          # single ubuntu-latest host - no macOS runner needed for the darwin
          # binaries. Windows is deferred (see README) - no target here.
          - target: bun-darwin-arm64
            asset: thoughtbridge-runner-macos-arm64
            name: macOS arm64
          - target: bun-darwin-x64
            asset: thoughtbridge-runner-macos-x64
            name: macOS x64
          - target: bun-linux-x64
            asset: thoughtbridge-runner-linux-x64
            name: Linux x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile ${{ matrix.asset }}
        run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile ${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach binaries to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist

      - name: Create or update the release with the binaries attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
